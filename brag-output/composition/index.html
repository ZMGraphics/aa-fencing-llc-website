<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'DisplayCondensed'; src: local('Impact'), local('Haettenschweiler'), local('Arial Narrow Bold'), local('Franklin Gothic Bold'); }
      @font-face { font-family: 'QuoteSerif'; src: local('Georgia'), local('Times New Roman'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      }
      #root { width: 100%; height: 100%; position: relative; background: #000; }
      .clip { position: absolute; inset: 0; }

      .display {
        font-family: 'DisplayCondensed', sans-serif;
        text-transform: uppercase; letter-spacing: 0.005em; line-height: 0.92; color: #fff;
      }
      .green { color: #1f8b2e; }
      .label {
        font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.14em; color: #fff;
      }

      /* ambient */
      #bg { position:absolute; inset:0; background:
        radial-gradient(90% 70% at 50% 40%, #141414 0%, #060606 70%, #000 100%); }
      #glow { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(70% 55% at 50% 52%, rgba(31,139,46,.30), rgba(31,139,46,0) 60%); opacity: 0; }

      /* green rail */
      .rail { position: absolute; height: 8px; background: #1f8b2e; transform-origin: left center;
        box-shadow: 0 2px 16px rgba(31,139,46,.45); }

      /* browser mockup */
      #frame {
        position:absolute; left:340px; top:182px; width:1240px; height:716px;
        background:#111; border:1px solid rgba(255,255,255,.14); border-radius:16px;
        box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6), 0 0 80px rgba(31,139,46,.10);
        overflow:hidden; transform-origin:50% 50%; will-change: transform;
      }
      #bar { height:56px; display:flex; align-items:center; gap:10px; padding:0 20px;
        background:#1a1a1a; border-bottom:1px solid rgba(255,255,255,.08); }
      .dotmac { width:14px; height:14px; border-radius:50%; }
      #url { margin:0 auto; height:34px; display:flex; align-items:center; gap:10px;
        background:#0a0a0a; border:1px solid rgba(255,255,255,.12); border-radius:17px;
        padding:0 18px; color:#e6e6e6; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:18px; letter-spacing:.02em; }
      #url .lock { width:11px; height:11px; border-radius:2px; background:#1f8b2e; box-shadow:0 0 8px rgba(31,139,46,.8); }
      #view { position:absolute; left:0; top:56px; width:1240px; height:660px; overflow:hidden; background:#fff; }
      #col { position:absolute; left:0; top:0; width:1240px; will-change: transform; }
      #col img { display:block; width:1240px; height:auto; }

      /* section caption chip (bottom-left, over frame) */
      #chip { position:absolute; left:372px; bottom:150px; display:flex; align-items:center; gap:16px;
        background:rgba(0,0,0,.72); border:1px solid rgba(31,139,46,.5); border-radius:10px;
        padding:14px 22px; opacity:0; will-change: transform, opacity; }
      #chip .bl { width:16px; height:16px; background:#1f8b2e; border-radius:3px; box-shadow:0 0 12px rgba(31,139,46,.8); flex:none; }
      #chip .tx { font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800; text-transform:uppercase;
        letter-spacing:.12em; font-size:30px; color:#fff; white-space:nowrap; }

      /* intro kicker */
      #kicker { position:absolute; left:0; right:0; top:120px; text-align:center; opacity:0; will-change:transform,opacity; }
      #kicker .tx { font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800; text-transform:uppercase;
        letter-spacing:.42em; font-size:30px; color:#1f8b2e; }

      /* outro lockup */
      #outro { position:absolute; inset:0; background:#000; opacity:0; display:flex; flex-direction:column;
        align-items:center; justify-content:center; text-align:center; }
      #outro img { width:210px; height:auto; opacity:0; will-change:transform,opacity; }
      #estLine { margin-top:22px; opacity:0; will-change:transform,opacity; }
      #estLine .est { font-family:'DisplayCondensed',sans-serif; text-transform:uppercase; color:#fff;
        font-size:150px; line-height:.9; letter-spacing:.01em; }
      #estLine .sub { margin-top:10px; font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800;
        text-transform:uppercase; letter-spacing:.3em; font-size:26px; color:#cfcfcf; }
      #urlOut { margin-top:34px; opacity:0; will-change:transform,opacity;
        font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800; letter-spacing:.06em; font-size:40px; color:#1f8b2e; }
      #tagOut { margin-top:14px; opacity:0; font-family:'QuoteSerif',Georgia,serif; font-style:italic;
        font-size:30px; color:#9a9a9a; }
      #outroRail { position:absolute; top:calc(50% - 250px); left:50%; height:6px; background:#1f8b2e;
        transform:translateX(-50%) scaleX(0); transform-origin:center; width:360px; box-shadow:0 0 18px rgba(31,139,46,.6); }
    </style>

<script>
window.__tailwindReady=new Promise(function(resolve){
var loaded=document.readyState==="complete";var resolved=false;var observer;
function readTailwindCss(){var styles=document.querySelectorAll("style");for(var i=styles.length-1;i>=0;i--){var text=styles[i].textContent||"";if(text.indexOf("tailwindcss v")!==-1)return text;}return "";}
function finish(){if(resolved||!loaded||!readTailwindCss())return;resolved=true;if(observer)observer.disconnect();resolve(true);}
observer=new MutationObserver(finish);observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
if(loaded){finish();}else{window.addEventListener("load",function(){loaded=true;finish();},{once:true});}
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js" integrity="sha384-v5YF9xS+gLRWdvrQ0u/WRbCkjSIH0NjHIPe8tBL1ZRrmI7PiSH6LLdzs0aAIMCuh" crossorigin="anonymous"></script>
</head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.2" data-width="1920" data-height="1080">

      <!-- ambient scene -->
      <div class="clip" data-start="0" data-duration="22.2" data-track-index="0">
        <div id="bg"></div>
        <div id="glow"></div>
        <div class="rail" id="railTop" style="left:340px; top:172px; width:1240px; transform:scaleX(0);"></div>
      </div>

      <!-- browser mockup + scrolling site -->
      <div class="clip" data-start="0" data-duration="22.2" data-track-index="0">
        <div id="frame">
          <div id="bar">
            <span class="dotmac" style="background:#ff5f57"></span>
            <span class="dotmac" style="background:#febc2e"></span>
            <span class="dotmac" style="background:#28c840"></span>
            <div id="url"><span class="lock"></span>aafencing-llc.com</div>
            <span style="width:44px"></span>
          </div>
          <div id="view">
            <div id="col" data-layout-allow-overflow>
              <img src="assets/screens/01-hero.jpg" alt="homepage" />
              <img src="assets/screens/02-gallery.jpg" alt="gallery" />
              <img src="assets/screens/03-beforeafter.jpg" alt="before after" />
              <img src="assets/screens/04-services.jpg" alt="services" />
              <img src="assets/screens/05-reviews.jpg" alt="reviews" />
              <img src="assets/screens/06-contact.jpg" alt="contact" />
            </div>
          </div>
        </div>

        <div id="kicker"><div class="tx">Now Live</div></div>

        <div id="chip"><span class="bl"></span><span class="tx" id="chipTx">The Homepage</span></div>
      </div>

      <!-- outro lockup -->
      <div class="clip" data-start="17.8" data-duration="4.4" data-track-index="0">
        <div id="outro">
          <div id="outroRail"></div>
          <img id="outroLogo" src="assets/img/AA-Logo-02.png" alt="AA Fencing LLC" />
          <div id="estLine">
            <div class="est">EST. 1992</div>
            <div class="sub">Rochester, NY</div>
          </div>
          <div id="urlOut">aafencing-llc.com</div>
          <div id="tagOut">Rochester's Trusted Fence Company.</div>
        </div>
      </div>

      <!-- audio -->
      <audio id="music" class="clip" data-start="0" data-duration="22.2" data-track-index="1" data-volume="0.6" src="assets/music/track.mp3"></audio>
      <audio id="sfx-settle"      data-start="1.15" data-duration="0.8" data-track-index="2" data-volume="0.7"  src="assets/sfx/settle.ogg"></audio>
      <audio id="sfx-kick"        data-start="1.6"  data-duration="1.0" data-track-index="3" data-volume="0.6"  src="assets/sfx/impact-heavy.ogg"></audio>
      <audio id="sfx-tick-1"      data-start="4.2"  data-duration="0.6" data-track-index="2" data-volume="0.5"  src="assets/sfx/tick.ogg"></audio>
      <audio id="sfx-sweep"       data-start="6.9"  data-duration="1.2" data-track-index="3" data-volume="0.5"  src="assets/sfx/sweep.ogg"></audio>
      <audio id="sfx-tick-2"      data-start="9.4"  data-duration="0.6" data-track-index="2" data-volume="0.5"  src="assets/sfx/tick.ogg"></audio>
      <audio id="sfx-shimmer"     data-start="12.8" data-duration="0.9" data-track-index="3" data-volume="0.65" src="assets/sfx/shimmer.ogg"></audio>
      <audio id="sfx-tick-3"      data-start="14.6" data-duration="0.6" data-track-index="2" data-volume="0.5"  src="assets/sfx/tick.ogg"></audio>
      <audio id="sfx-close"       data-start="18.85" data-duration="0.2" data-track-index="3" data-volume="1.0" src="assets/sfx/impact-heavy.ogg"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- INTRO (0 - 2.2) ----
      tl.set("#frame", { scale: 0.92, opacity: 0 }, 0);
      tl.set("#col", { y: 0 }, 0);
      tl.fromTo("#railTop", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.25);
      tl.to("#frame", { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0.7); // frame settle
      tl.fromTo("#kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2);
      tl.to("#kicker", { opacity: 0, y: -12, duration: 0.45, ease: "power2.in" }, 2.35);

      // beat glow pulses (deterministic, seek-safe)
      const pulse = (t, peak) => { tl.to("#glow", { opacity: peak, duration: 0.18, ease: "power2.out" }, t)
                                     .to("#glow", { opacity: 0.05, duration: 0.34, ease: "power2.in" }, t + 0.18); };
      [1.6, 4.2, 6.9, 9.4, 11.9, 14.6, 18.9].forEach((t,i)=> pulse(t, i===6 ? 0.5 : 0.24));

      // ---- SCROLL JOURNEY (2.2 - 17.6) ----
      // helper to show a caption chip during a hold window
      const chip = (text, tin) => {
        tl.set("#chipTx", { innerText: text }, tin - 0.001);
        tl.fromTo("#chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, tin);
        tl.to("#chip", { opacity: 0, y: -10, duration: 0.35, ease: "power2.in" }, tin + 1.5);
      };

      // hero hold
      chip("The Homepage", 2.5);
      // scroll to gallery
      tl.to("#col", { y: -685, duration: 0.9, ease: "power2.inOut" }, 4.2);
      chip("Real Rochester Jobs", 5.25);
      // scroll to before/after
      tl.to("#col", { y: -1371, duration: 0.9, ease: "power2.inOut" }, 6.9);
      chip("Before / After Slider", 7.9);
      // scroll to services
      tl.to("#col", { y: -2056, duration: 0.9, ease: "power2.inOut" }, 9.4);
      chip("Full Service Lineup", 10.4);
      // scroll to reviews
      tl.to("#col", { y: -2741, duration: 0.9, ease: "power2.inOut" }, 11.9);
      chip("4.25 Stars / 53 Reviews", 12.9);
      // scroll to contact
      tl.to("#col", { y: -3427, duration: 0.9, ease: "power2.inOut" }, 14.6);
      chip("Talk To The Owners", 15.6);

      // ---- OUTRO LOCKUP (17.8 - 22.2) ----
      tl.set("#outro", { opacity: 0 }, 0);
      tl.to("#frame", { scale: 0.9, opacity: 0, duration: 0.7, ease: "power2.in" }, 17.9);
      tl.to("#chip", { opacity: 0, duration: 0.3 }, 17.9);
      tl.to("#outro", { opacity: 1, duration: 0.5, ease: "power2.out" }, 18.2);
      tl.fromTo("#outroRail", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 18.4);
      tl.fromTo("#outroLogo", { opacity: 0, scale: 0.8, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" }, 18.6);
      // beat-locked: EST. 1992 impact
      tl.fromTo("#estLine", { opacity: 0, scale: 1.25, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power4.out" }, 18.9);
      tl.fromTo("#urlOut", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 19.5);
      tl.fromTo("#tagOut", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 19.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
