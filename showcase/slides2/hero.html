<!doctype html><html lang=en><head><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f8b2e;--lime:#35c04a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:'Poppins',sans-serif;background:#060706}
.scene{position:absolute;inset:0;background:url("file:///Users/zmeakin/aa-fencing-llc-website/public/images/gallery/fence-7.jpeg") center 30% / cover no-repeat;transform:scale(1.06)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,6,.5) 0%,rgba(6,7,6,.05) 30%,rgba(6,7,6,.3) 55%,rgba(6,7,6,.97) 100%)}
.tint{position:absolute;inset:0;background:radial-gradient(120% 80% at 66% 36%,rgba(31,139,46,.16),transparent 55%);mix-blend-mode:screen}
.grain{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.top{position:absolute;top:70px;left:76px;right:76px;display:flex;justify-content:space-between;align-items:center;z-index:30}
.top img{height:56px;filter:brightness(0) invert(1)}
.est{font-family:'Anton';font-size:22px;letter-spacing:.14em;color:#fff;opacity:.85}
.est b{color:var(--lime)}
/* floating display panel */
.stageL{position:absolute;top:330px;left:52%;transform:translateX(-50%);z-index:18;perspective:2800px}
.gshadow{position:absolute;top:812px;left:50%;width:720px;height:70px;transform:translateX(-50%);z-index:17;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.72),transparent 72%);filter:blur(10px)}
.panel{transform:rotateX(5deg) rotateY(-15deg);transform-origin:center center;
  width:900px;height:566px;background:linear-gradient(135deg,#2b2e31,#141516);border-radius:22px;padding:16px;
  box-shadow:0 55px 80px -18px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(0,0,0,.5)}
.screen{width:100%;height:100%;border-radius:10px;overflow:hidden;position:relative;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.screen img{width:100%;display:block}
.glare{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 74%,rgba(255,255,255,.05) 100%)}
.stand{position:absolute;top:806px;left:50%;transform:translateX(-50%) rotateX(5deg);width:120px;height:26px;z-index:16;
  background:linear-gradient(180deg,#b9bdc1,#6b6f73);border-radius:4px 4px 7px 7px}
.copy{position:absolute;left:76px;bottom:94px;z-index:30}
.copy h1{font-family:'Anton';font-size:132px;line-height:.84;color:#fff;text-transform:uppercase}
.copy h1 .g{color:var(--lime)}
.copy .url{margin-top:28px;display:inline-flex;align-items:center;gap:14px;font-family:'Anton';font-size:30px;
  letter-spacing:.06em;color:#061006;background:var(--lime);padding:13px 26px;border-radius:7px;box-shadow:0 12px 34px rgba(53,192,74,.45)}
.cred{position:absolute;right:76px;bottom:104px;z-index:30;text-align:right;font-size:19px;color:#b6bab6;font-weight:600}
.cred b{color:#fff}
</style></head><body>
<div class="scene"></div><div class="grade"></div><div class="tint"></div>
<div class="top"><img src="file:///Users/zmeakin/aa-fencing-llc-website/public/images/site/AA-Logo-03.png"><div class="est">EST. <b>1992</b> · ROCHESTER NY</div></div>
<div class="gshadow"></div><div class="stand"></div>
<div class="stageL"><div class="panel"><div class="screen"><img src="file:///Users/zmeakin/aa-fencing-llc-website/showcase/captures/desktop-hero.jpg"><div class="glare"></div></div></div></div>
<div class="copy">
  <h1>THE WORK<br>IS REAL.<br><span class="g">SO'S THE SITE.</span></h1>
  <div class="url">aafencing-llc.com →</div>
</div>
<div class="cred">New site by<br><b>Zandyr Meakin Graphics</b></div>
<div class="grain"></div>
</body></html>
