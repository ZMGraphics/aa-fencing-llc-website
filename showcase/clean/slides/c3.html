<!doctype html><html lang=en><head><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f3ef;--ink:#17191b;--muted:#8a8c86;--green:#1f8b2e;--line:#e3e1da}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--paper);color:var(--ink);
 -webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.stage{position:absolute;inset:0;padding:92px;display:flex;flex-direction:column}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:600;letter-spacing:.02em}
.meta .r{color:var(--muted);font-weight:500}
/* flat browser */
.bw{border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);
 box-shadow:0 2px 2px rgba(20,22,24,.03),0 30px 60px -18px rgba(20,22,24,.18)}
.bw .bar{height:44px;background:#fbfbfa;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px}
.bw .bar i{width:11px;height:11px;border-radius:50%;background:#dcdcd6;display:block}
.bw .u{margin-left:16px;flex:1;height:26px;background:#f1f0ec;border-radius:7px;display:flex;align-items:center;justify-content:center;
 font-size:14px;color:#9a9c96;font-weight:500}
.bw img{display:block;width:100%}
/* phone */
.ph{width:300px;border-radius:40px;background:#111;padding:9px;box-shadow:0 30px 60px -20px rgba(20,22,24,.25)}
.ph .s{border-radius:32px;overflow:hidden;background:#000}
.ph .s img{display:block;width:100%}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.rule{height:2px;background:var(--green);border-radius:2px}
</style></head><body><div class="stage">
  <div class="meta"><span>DETAIL</span><span class="r">Interaction</span></div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px">
    <div style="font-size:40px;font-weight:600;letter-spacing:-.01em;max-width:720px">A live before / after slider &mdash; drag to reveal the work.</div>
    <div class="bw" style="width:100%"><div class="bar"><i></i><i></i><i></i>
    <div class="u">aafencing-llc.com</div></div><img src="file:///Users/zmeakin/aa-fencing-llc-website/showcase/captures/desktop-beforeafter.jpg"></div>
  </div>
</div></body></html>
