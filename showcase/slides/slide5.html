<!doctype html><html lang=en><head><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#1f8b2e;--ink:#070707;--card:#141414;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--ink);color:#fff;
 overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
/* grain + vignette */
body::before{content:"";position:absolute;inset:0;z-index:0;
 background:radial-gradient(130% 90% at 50% 0%,#1a1a1a 0%,#070707 60%);}
body::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:.05;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.stage{position:absolute;inset:0;z-index:10;padding:84px 76px;display:flex;flex-direction:column}
/* green rail motif */
.rail{position:absolute;left:76px;right:76px;height:3px;background:linear-gradient(90deg,var(--green),#2fb042);border-radius:2px;z-index:20}
.rail .post{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(31,139,46,.8)}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:21px;font-weight:600;letter-spacing:.22em;
 text-transform:uppercase;color:var(--green)}
.kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
h1{font-weight:800;letter-spacing:-.02em;line-height:.98}
.logo{height:64px}
.credit{display:flex;align-items:center;gap:16px;font-size:22px;color:#9a9a9a;font-weight:500}
.credit b{color:#fff;font-weight:700}
/* browser frame */
.browser{border-radius:16px;overflow:hidden;background:var(--card);
 box-shadow:0 50px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.07);}
.bar{height:46px;background:#1c1c1c;display:flex;align-items:center;padding:0 18px;gap:9px;
 border-bottom:1px solid rgba(255,255,255,.06)}
.bar i{width:12px;height:12px;border-radius:50%;display:block}
.bar .r{background:#ff5f57}.bar .y{background:#febc2e}.bar .g{background:#28c840}
.url{margin-left:18px;flex:1;height:28px;background:#0e0e0e;border-radius:8px;display:flex;align-items:center;
 justify-content:center;gap:9px;font-size:16px;color:#cфcfcf;color:#cfcfcf;font-weight:500;letter-spacing:.01em}
.url svg{width:13px;height:13px;opacity:.7}
.browser img{display:block;width:100%}
/* phone frame */
.phone{width:372px;border-radius:52px;background:#0c0c0c;padding:12px;
 box-shadow:0 55px 90px -28px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.08),inset 0 0 0 2px #262626;position:relative}
.phone .screen{border-radius:42px;overflow:hidden;position:relative;background:#000}
.phone .screen img{display:block;width:100%}
.phone .notch{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:118px;height:30px;
 background:#0c0c0c;border-radius:16px;z-index:5}
.badge{display:inline-flex;align-items:center;gap:10px;background:rgba(31,139,46,.12);
 border:1px solid rgba(31,139,46,.35);color:var(--green);padding:10px 18px;border-radius:999px;
 font-size:19px;font-weight:600;letter-spacing:.02em}
</style></head><body><div class="stage" style="justify-content:center;align-items:center;text-align:center;gap:38px">
  <img class="logo" src="file:///Users/zmeakin/aa-fencing-llc-website/public/images/site/AA-Logo-03.png" style="height:150px;filter:brightness(0) invert(1)">
  <h1 style="font-size:70px">See it live.</h1>
  <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:760px"><span style="display:inline-flex;align-items:center;background:rgba(31,139,46,.14);border:1px solid rgba(47,176,66,.5);color:#43c35a;padding:12px 22px;border-radius:999px;font-size:21px;font-weight:600">Residential</span><span style="display:inline-flex;align-items:center;background:rgba(31,139,46,.14);border:1px solid rgba(47,176,66,.5);color:#43c35a;padding:12px 22px;border-radius:999px;font-size:21px;font-weight:600">Commercial</span><span style="display:inline-flex;align-items:center;background:rgba(31,139,46,.14);border:1px solid rgba(47,176,66,.5);color:#43c35a;padding:12px 22px;border-radius:999px;font-size:21px;font-weight:600">Bollards &amp; Signage</span><span style="display:inline-flex;align-items:center;background:rgba(31,139,46,.14);border:1px solid rgba(47,176,66,.5);color:#43c35a;padding:12px 22px;border-radius:999px;font-size:21px;font-weight:600">Concrete &amp; Landscaping</span></div>
  <div style="width:120px;height:3px;background:linear-gradient(90deg,var(--green),#2fb042);border-radius:2px;margin-top:8px"></div>
  <div style="font-size:50px;font-weight:700;color:var(--green);letter-spacing:.01em">aafencing-llc.com</div>
  <div class="credit" style="position:absolute;bottom:84px;left:0;right:0;justify-content:center">Design &amp; build by&nbsp;<b>Zandyr Meakin Graphics</b>&nbsp;· zandyrmeakingraphics.com</div>
</div></body></html>
